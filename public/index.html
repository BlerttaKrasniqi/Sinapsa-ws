<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sinapsa</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root{
  --brand:#1800AD; --brand-ink:#FFFFFF;
  --bg:#F4F3FA; --surface:#FFFFFF; --surface-2:#F9F8FD; --ink:#16133D; --muted:#5D5A7E;
  --line:#DDDAF0; --accent:#1800AD; --accent-hover:#12008A; --accent-ink:#FFFFFF; --accent-soft:#E7E4FB;
  --good:#1D7F47; --good-soft:#DDF3E5; --warn:#B4441A; --warn-soft:#FBE7DD; --danger:#B42318;
  --shadow:0 1px 2px rgba(22,19,61,.06),0 6px 20px rgba(22,19,61,.07);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C0A22; --surface:#15123A; --surface-2:#1B1845; --ink:#ECEAFB; --muted:#A19DC8;
    --line:#2B2760; --accent:#9C90FF; --accent-hover:#B3AAFF; --accent-ink:#0C0A22; --accent-soft:#251F66;
    --good:#5BD08D; --good-soft:#173524; --warn:#F09067; --warn-soft:#3B2219; --danger:#F2867C;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C0A22; --surface:#15123A; --surface-2:#1B1845; --ink:#ECEAFB; --muted:#A19DC8;
  --line:#2B2760; --accent:#9C90FF; --accent-hover:#B3AAFF; --accent-ink:#0C0A22; --accent-soft:#251F66;
  --good:#5BD08D; --good-soft:#173524; --warn:#F09067; --warn-soft:#3B2219; --danger:#F2867C;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}

/* NAV */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.nav-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px 0;flex-shrink:0}
.brand img{width:38px;height:38px;border-radius:10px;display:block}
.brand-name{font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:-.02em;color:var(--ink)}
.search{flex:1;min-width:0;position:relative;max-width:520px}
.search input{width:100%;height:44px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 16px 0 44px;font-size:16px}
.search input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.menu{display:flex;align-items:center;gap:2px;margin-left:auto}
.menu-link{background:none;border:0;padding:10px 11px;border-radius:10px;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
.menu-link:hover{background:var(--accent-soft);color:var(--ink)}
.menu-link[aria-current="page"]{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--accent)}
.btn-danger{background:var(--surface);border-color:var(--line);color:var(--danger)}
.btn-danger:hover{border-color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.hamb{display:none;background:none;border:1.5px solid var(--line);border-radius:10px;width:44px;height:44px;cursor:pointer;place-items:center;flex-shrink:0}
.mobile-menu{display:none;border-top:1px solid var(--line);padding:8px 16px 14px;flex-direction:column;gap:6px}
.mobile-menu .menu-link{text-align:left;padding:12px}
.user-chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px 0 6px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;max-width:220px}
.user-chip:hover{border-color:var(--accent)}
.user-chip .avatar{width:32px;height:32px}
.user-chip span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd{position:relative}
.dd-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:200px;z-index:30;display:flex;flex-direction:column}
.dd-menu button{background:none;border:0;text-align:left;padding:11px 12px;border-radius:8px;cursor:pointer;font-weight:700}
.dd-menu button:hover{background:var(--accent-soft)}
.dd-menu .who{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.admin-badge{display:inline-block;background:var(--brand);color:#fff;border-radius:6px;font-size:11px;font-weight:700;padding:1px 6px;letter-spacing:.04em;vertical-align:middle}
@media (max-width:1260px){
  .menu{display:none}
  .hamb{display:grid}
  .nav-in{flex-wrap:wrap;gap:10px}
  .search{order:3;flex-basis:100%;max-width:none}
  .brand{margin-right:auto}
  .mobile-menu.open{display:flex}
}

main{max-width:1180px;margin:0 auto;padding:28px 16px 64px}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:15px}

/* HOME */
.hero{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;padding:30px 28px;background:var(--brand);color:var(--brand-ink);border-radius:22px;margin-bottom:34px}
.hero h1{font-size:clamp(28px,4.4vw,42px);font-weight:800;letter-spacing:-.02em;max-width:18ch}
.hero p{margin:10px 0 0;opacity:.88;max-width:54ch}
.hero-deco{position:absolute;right:-30px;top:-40px;width:260px;height:260px;opacity:.14;pointer-events:none}
.hero2 .hero-deco{left:-50px;right:auto;top:auto;bottom:-70px}
.hero-actions{display:flex;flex-direction:column;gap:10px;position:relative}
.btn-white{background:#fff;color:var(--brand)}
.btn-white:hover{background:#EFEDFF}
.btn-outline-white{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.btn-outline-white:hover{border-color:#fff}
.steps{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:18px;padding:0;list-style:none;font-size:15px}
.steps li{display:flex;align-items:center;gap:8px}
.steps b{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:13px}
.section{margin-bottom:38px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.section-head h2{font-size:22px;font-weight:800}
.link-btn{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:6px 0}
.fac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.fac-tile{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;cursor:pointer;text-align:left;font-weight:700}
.fac-tile:hover{border-color:var(--accent)}
.fac-tile small{color:var(--muted);font-weight:400;white-space:nowrap;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters label{font-weight:700;font-size:15px}
.filters select{min-width:0;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.set-card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:180px;transition:border-color .15s,transform .15s}
.set-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.set-card h3{font-size:19px;font-weight:600;overflow-wrap:anywhere}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--muted);max-width:100%}
.fac{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.author{display:flex;align-items:center;gap:9px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
.author .by{color:var(--muted);font-size:12px;line-height:1.1}
.author .nm{font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.mat-card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;display:flex;gap:14px;align-items:flex-start;text-align:left;transition:border-color .15s}
.mat-card:hover{border-color:var(--accent)}
.mat-card h3{font-size:17px;font-weight:600;overflow-wrap:anywhere;margin-bottom:6px}
.mat-card .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.ftype{width:52px;height:62px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:.04em;flex-shrink:0;color:#fff;overflow:hidden}
.ftype img{width:100%;height:100%;object-fit:cover}
.t-pdf{background:#C0392B}.t-word{background:#2B5CC0}.t-ppt{background:#C8561D}.t-excel{background:#1E7B45}.t-foto{background:#6B3FC0}.t-tekst{background:#5D5A7E}.t-zip{background:#6E6A55}.t-tjeter{background:#4A4868}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--radius);padding:36px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}

/* FORM */
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.page-head p{color:var(--muted);margin:6px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}
.panel h2{font-size:18px;font-weight:600;margin-bottom:4px}
.panel .hint{color:var(--muted);font-size:14px;margin:0 0 14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fields .full{grid-column:1/-1}
@media (max-width:640px){.fields{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.opt{font-weight:400;color:var(--muted);font-size:13px}
input.t,textarea.t,select.t{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px 13px;font-size:16px;width:100%}
input.t:focus,textarea.t:focus,select.t:focus{border-color:var(--accent);outline:none;background:var(--surface)}
textarea.t{resize:vertical;min-height:52px}
.card-row{display:grid;grid-template-columns:36px 1fr 1fr auto;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.card-row:first-child{border-top:0}
.card-num{font-family:var(--display);font-weight:800;color:var(--muted);font-size:18px;padding-top:34px;font-variant-numeric:tabular-nums}
.card-side{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card-tools{display:flex;flex-direction:column;gap:8px;padding-top:26px}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.del:hover{border-color:var(--danger);color:var(--danger)}
.card-img{display:flex;align-items:center;gap:8px;margin-top:4px;text-transform:none;letter-spacing:0;font-weight:400;flex-wrap:wrap}
.card-img img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
@media (max-width:640px){
  .card-row{grid-template-columns:1fr auto;}
  .card-num{grid-column:1/-1;padding-top:0}
  .card-row .card-side{grid-column:1/2}
  .card-tools{grid-row:2/4;grid-column:2;padding-top:24px}
}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--surface-2);transition:border-color .15s,background .15s;color:var(--accent)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{display:block;font-size:17px;margin:8px 0 2px;color:var(--ink)}
.drop small{color:var(--muted)}
.file-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.file-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.file-item .ftype{width:42px;height:42px}
.file-meta{flex:1;min-width:0}
.file-meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta small{color:var(--muted)}
.save-bar{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
details.bulk{margin-top:14px}
details.bulk summary{cursor:pointer;font-weight:700;color:var(--accent);padding:6px 0}
.err{color:var(--danger);font-weight:700;font-size:14px}
.bar{height:10px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

/* SET VIEW */
.back{background:none;border:0;color:var(--muted);font-weight:700;cursor:pointer;padding:8px 0;margin-bottom:10px;display:inline-flex;align-items:center;gap:6px}
.back:hover{color:var(--accent)}
.set-title{font-size:clamp(28px,4.5vw,40px);font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.set-desc{color:var(--muted);max-width:65ch;margin:8px 0 0}
.set-meta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:14px}
.study{max-width:760px;margin:28px auto 8px}
.flip{perspective:1600px;cursor:pointer;user-select:none}
.flip-in{position:relative;height:min(380px,62vw);min-height:260px;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 28px;text-align:center;overflow:auto}
.face.back-f{transform:rotateY(180deg);border-top:5px solid var(--accent)}
.face .lbl{position:absolute;top:14px;left:18px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.face .tap{position:absolute;bottom:12px;left:0;right:0;font-size:13px;color:var(--muted)}
.face .txt{font-size:clamp(20px,3.4vw,30px);font-weight:700;max-width:34ch;overflow-wrap:anywhere;white-space:pre-wrap}
.face.back-f .txt{font-weight:400;font-size:clamp(17px,2.6vw,23px)}
.face img{max-height:45%;max-width:100%;border-radius:10px;object-fit:contain}
@media (prefers-reduced-motion:reduce){.flip-in,.set-card,.bar i{transition:none}}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.nav-arrows{display:flex;align-items:center;gap:12px}
.round{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.round:hover{border-color:var(--accent);color:var(--accent)}
.round[disabled]{opacity:.4;cursor:default}
.counter{font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;min-width:70px;text-align:center}
.progress{height:6px;background:var(--line);border-radius:6px;margin-top:14px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.judge{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn-learn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn-know{background:var(--good-soft);color:var(--good);border-color:transparent}
.tally{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.tally b{font-variant-numeric:tabular-nums}
.kbd{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.done{text-align:center;padding:40px 20px;background:var(--surface);border:1.5px solid var(--line);border-radius:20px}
.done h2{font-size:28px;font-weight:800;margin-bottom:6px}
.done .big{display:flex;gap:28px;justify-content:center;margin:18px 0}
.done .big div{font-size:14px;color:var(--muted)}
.done .big b{display:block;font-family:var(--display);font-size:40px;font-weight:800}
.cols{display:grid;grid-template-columns:1fr;gap:26px;margin-top:36px}
.terms{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.term{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:18px;padding:16px 20px;border-top:1px solid var(--line)}
.term:first-child{border-top:0}
.term b{overflow-wrap:anywhere}
.term p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.term img{max-width:160px;border-radius:8px;margin-top:8px;display:block}
@media (max-width:560px){.term{grid-template-columns:1fr;gap:4px}}
.files-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
a.file-item,button.file-item{text-decoration:none;color:inherit;cursor:pointer;text-align:left}
a.file-item:hover,button.file-item:hover{border-color:var(--accent)}
.confirm{background:var(--warn-soft);border-radius:12px;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}

/* MATERIAL VIEW */
.viewer{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;flex-wrap:wrap}
.viewer-body{background:var(--surface-2);min-height:200px}
.viewer iframe{display:block;width:100%;height:80vh;border:0;background:#fff}
.viewer .img-wrap{padding:16px;text-align:center}
.viewer pre{margin:0;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:80vh;overflow:auto}
.viewer .msg{padding:40px 20px;text-align:center;color:var(--muted)}
.viewer .msg b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.docx-wrap{max-height:80vh;overflow:auto;background:#E9E8F2}
.docx-wrap .docx-wrapper{background:#E9E8F2!important;padding:16px!important}
.sheet-wrap{max-height:80vh;overflow:auto;background:#fff;color:#111}
.sheet-wrap table{border-collapse:collapse;font-size:14px}
.sheet-wrap td,.sheet-wrap th{border:1px solid #ddd;padding:4px 8px;white-space:nowrap}
.sheet-tabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;z-index:50;max-width:calc(100% - 32px);text-align:center}
.lightbox{position:fixed;inset:0;background:rgba(8,6,28,.88);z-index:60;display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lightbox img{max-height:90vh;max-width:100%;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* HERO ME VIDEO */
.hero2{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:center;background:var(--brand);color:#fff;border-radius:24px;padding:38px 36px;margin-bottom:34px}
.hero2 h1{font-size:clamp(34px,5vw,56px);font-weight:800;letter-spacing:-.03em;line-height:1.02}
.hero2 p{margin:14px 0 0;opacity:.9;max-width:46ch;font-size:17px}
.hero2 .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.hero2 .cta .btn{min-height:52px;padding:0 24px;font-size:17px}
.hero2 .mini{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-size:14px;opacity:.85;list-style:none;padding:0}
.hero2 .mini li{display:flex;align-items:center;gap:6px}
.demo{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(4,0,40,.45);background:#0C0A22;border:1px solid rgba(255,255,255,.18)}
.demo .chrome{height:28px;background:#241F63;display:flex;gap:6px;align-items:center;padding:0 12px}
.demo .chrome i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35)}
.demo .chrome span{margin-left:10px;font-size:11px;color:rgba(255,255,255,.7);background:rgba(255,255,255,.1);padding:2px 10px;border-radius:6px}
.demo video{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#0C0A22}
.demo .vbtn{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(12,10,34,.6);color:#fff;cursor:pointer;display:grid;place-items:center}
@media (max-width:900px){.hero2{grid-template-columns:1fr;padding:28px 20px;gap:24px}}

/* MËNYRAT E STUDIMIT */
.modes{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px;width:max-content;max-width:100%;margin:28px auto 0;overflow-x:auto}
.modes button{border:0;background:none;padding:10px 18px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--muted);display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.modes button:hover{color:var(--ink)}
.modes button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.ai-pill{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft));color:var(--accent);border-color:transparent}

/* LOJA: KUIZ */
.game{max-width:760px;margin:22px auto 0}
.game-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.hearts{display:flex;gap:3px;flex-shrink:0}
.hearts svg{display:block}
.gbar{flex:1;height:14px;background:var(--line);border-radius:14px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--good);border-radius:14px;transition:width .35s}
.xp{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.streak{display:inline-flex;align-items:center;gap:3px;color:#E8590C;font-weight:800;font-variant-numeric:tabular-nums}
.mute{background:none;border:0;cursor:pointer;color:var(--muted);width:36px;height:36px;display:grid;place-items:center;border-radius:8px;flex-shrink:0}
.mute:hover{color:var(--ink)}
.qcard{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow)}
.qhint{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.qtext{font-size:clamp(19px,2.8vw,25px);font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.opts{display:grid;gap:10px;margin-top:20px}
.qopt{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);cursor:pointer;font-size:17px;line-height:1.35;transition:transform .08s}
.qopt:hover:not([disabled]){border-color:var(--accent)}
.qopt:active:not([disabled]){transform:translateY(2px);border-bottom-width:2px}
.qopt[disabled]{cursor:default}
.qopt .k{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted);flex-shrink:0}
.qopt span.t{overflow-wrap:anywhere}
.qopt.right{border-color:var(--good);background:var(--good-soft)}
.qopt.right .k{background:var(--good);border-color:var(--good);color:#fff}
.qopt.wrong{border-color:var(--danger);background:var(--warn-soft)}
.qopt.wrong .k{background:var(--danger);border-color:var(--danger);color:#fff}
.qopt.dim{opacity:.55}
.fbk{margin-top:14px;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fbk.ok{background:var(--good-soft)}.fbk.no{background:var(--warn-soft)}
.fbk .msg{flex:1;min-width:200px}
.fbk .msg b{display:block;font-size:18px}
.fbk.ok .msg b{color:var(--good)}.fbk.no .msg b{color:var(--danger)}
.fbk .msg span{font-size:15px}
.pop{position:fixed;pointer-events:none;font-family:var(--display);font-weight:800;color:var(--good);font-size:22px;z-index:70;animation:pop .9s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.result{text-align:center;padding:36px 20px;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.result h2{font-size:30px;font-weight:800}
.stars{display:flex;justify-content:center;gap:8px;margin:14px 0 6px}
.stars svg{width:52px;height:52px}
.rstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;max-width:520px;margin:18px auto}
.rstats div{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px}
.rstats b{display:block;font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.rstats small{color:var(--muted);font-weight:700}
.day-streak{display:inline-flex;align-items:center;gap:6px;background:#FFF1E6;color:#B4441A;border-radius:999px;padding:6px 14px;font-weight:800}
:root[data-theme="dark"] .day-streak{background:#3B2219;color:#F09067}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .day-streak{background:#3B2219;color:#F09067}}

/* LOJA: PËRPUTH */
.match-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.clock{font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.match-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.match-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mt{min-height:104px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);padding:10px 12px;font-size:14px;line-height:1.35;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;transition:opacity .3s,transform .3s}
.mt.term{font-weight:700;font-size:15px}
.mt:hover{border-color:var(--accent)}
.mt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt.bad{border-color:var(--danger);background:var(--warn-soft)}
.mt.ok{border-color:var(--good);background:var(--good-soft)}
.mt.gone{opacity:0;transform:scale(.9);pointer-events:none}
@media (prefers-reduced-motion:reduce){.pop,.shake{animation:none}.mt,.gbar i,.opt{transition:none}}

/* KARTAT AUTOMATIKE TE MATERIALI */
.ai-box{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--accent-soft);border:1.5px solid transparent;border-radius:18px;padding:16px 18px;margin-top:22px}
.ai-box.ready{background:var(--brand);color:#fff}
.ai-box.ready .body span{color:rgba(255,255,255,.85)}
.ai-box.ready .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.ai-box.ready .btn-primary{background:#fff;color:var(--brand)}
.ai-box.fail{background:var(--warn-soft)}
.ai-box .ai-ic{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex-shrink:0}
.ai-box:not(.ready) .ai-ic{background:var(--surface)}
.ai-box .body{flex:1;min-width:220px;display:flex;flex-direction:column;gap:2px}
.ai-box .body b{font-size:17px}
.ai-box .body span{font-size:14px;color:var(--muted)}
.ai-box .acts{display:flex;gap:8px;flex-wrap:wrap}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
/* AI */
.ai-drop{border:2px dashed var(--accent);background:var(--accent-soft)}
.ai-drop:hover,.ai-drop.over{background:var(--surface)}
.chips-r{display:flex;gap:8px;flex-wrap:wrap}
.chips-r button{min-width:56px;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.chips-r button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.gen{text-align:center;padding:48px 20px;background:var(--surface);border:1.5px solid var(--line);border-radius:22px}
.gen img{width:72px;height:72px;border-radius:18px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 14px rgba(24,0,173,.12)}}
@media (prefers-reduced-motion:reduce){.gen img{animation:none}}
.gen h2{font-size:24px;font-weight:800;margin:18px 0 6px}
.gen-steps{list-style:none;padding:0;margin:20px auto 0;max-width:340px;text-align:left;display:flex;flex-direction:column;gap:10px}
.gen-steps li{display:flex;gap:10px;align-items:center;color:var(--muted);font-weight:700}
.gen-steps li .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;font-size:12px}
.gen-steps li.on{color:var(--ink)}
.gen-steps li.on .dot{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.gen-steps li.done{color:var(--good)}
.gen-steps li.done .dot{border-color:var(--good);background:var(--good);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
footer{max-width:1180px;margin:0 auto;padding:22px 16px 40px;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line)}
footer .fb{display:flex;align-items:center;gap:10px}
footer img{width:24px;height:24px;border-radius:6px}
.socials{display:flex;gap:8px;flex-wrap:wrap}
.soc{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700}
.soc:hover{border-color:var(--accent);color:var(--accent)}
.soc.icon-only{width:44px;padding:0;justify-content:center}

/* ABOUT */
.about-hero{background:var(--brand);color:#fff;border-radius:22px;padding:34px 28px;position:relative;overflow:hidden;margin-bottom:26px}
.about-hero h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.02em}
.about-hero p{max-width:60ch;opacity:.9;margin:12px 0 0;font-size:17px}
.about-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:26px}
.about-grid .panel{margin:0}
.about-grid h3{font-size:18px;font-weight:600;margin-bottom:6px}
.about-grid p{margin:0;color:var(--muted)}

/* AUTH */
.auth{max-width:440px;margin:10px auto}
.auth .panel{padding:26px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{border:0;background:none;padding:10px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.auth form{display:flex;flex-direction:column;gap:14px}

/* ADMIN */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.tile .k{font-size:13px;font-weight:700;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.tile .s{font-size:13px;color:var(--muted)}
.tile.hl{background:var(--brand);border-color:var(--brand);color:#fff}
.tile.hl .k,.tile.hl .s{color:rgba(255,255,255,.8)}
.live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3ED68A;margin-right:6px;box-shadow:0 0 0 3px rgba(62,214,138,.25)}
.chart{position:relative;height:200px;display:flex;align-items:flex-end;gap:2px;padding:0 0 22px;border-bottom:1px solid var(--line);margin-top:10px}
.chart .grid-l{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chart .grid-l span{position:absolute;right:0;top:-16px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:default;min-width:0}
.chart .bar{background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.chart .col:hover .bar,.chart .col:focus .bar{background:var(--accent-hover)}
.chart .col.today .bar{background:var(--accent)}
.chart .col:not(.today) .bar{opacity:.75}
.chart .lbl{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.chart .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;pointer-events:none;opacity:0;z-index:2}
.chart .col:hover .tip,.chart .col:focus .tip{opacity:1}
.admin-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:900px){.admin-cols{grid-template-columns:1fr}}
.task-list{display:flex;flex-direction:column}
.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.task:first-child{border-top:0}
.task .body{flex:1;min-width:200px}
.task .body b{display:block;overflow-wrap:anywhere}
.task .body small{color:var(--muted)}
.task .acts{display:flex;gap:6px;flex-wrap:wrap}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px}
.count-badge{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:800;margin-left:6px;vertical-align:middle}
.table-wrap{overflow-x:auto}
table.users{width:100%;border-collapse:collapse;font-size:14px}
table.users th{text-align:left;color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line)}
table.users td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.users td.num{font-variant-numeric:tabular-nums}
.report-box{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.report-box input{flex:1;min-width:200px}
.multi-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.multi-row .ftype{width:42px;height:42px}
.multi-row .inner{min-width:0;display:flex;flex-direction:column;gap:4px}
.multi-row small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.multi-row .st{font-size:13px;font-weight:700}
.multi-row .st.ok{color:var(--good)}.multi-row .st.bad{color:var(--danger)}
</style>
</head>

<script>
(function(){
const FACULTIES=[
  "Mjekësi","Stomatologji","Farmaci","Infermieri dhe Shkenca Shëndetësore","Juridik","Ekonomik",

  "Shkenca Sportive","Arte","Muzikë","Gazetari dhe Komunikim","Turizëm","Siguri dhe Studime Mbrojtëse","Tjetër"
];

const MAX_MB=50;
const $=(s,r=document)=>r.querySelector(s);

const app=$("#app");

let dbState="loading", sets=[], materials=[], me=null, aiOn=false, shownAiStatus="";
let view={name:"home"}, facultyFilter="", query="";

function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function visitorId(){let v=lsGet("sin_vid","");if(!v){v=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());lsSet("sin_vid",v)}return v}
/* Çelësat e pronësisë: kush krijon një set/material në këtë pajisje merr një çelës sekret */
function ownerKeys(){return lsGet("sin_keys",{})}
function saveOwnerKey(id,key){if(!key)return;const k=ownerKeys();k[id]=key;lsSet("sin_keys",k)}
function canManage(item){return !!(item&&(item.mine||(me&&me.isAdmin)||ownerKeys()[item.id]))}
function isMine(item){return !!(item&&(item.mine||ownerKeys()[item.id]))}
async function api(method,path,body,extra){
  const headers=Object.assign({"X-Visitor":visitorId()},body?{"Content-Type":"application/json"}:{},extra||{});
  const r=await fetch(path,{method,headers,body:body?JSON.stringify(body):undefined,credentials:"same-origin"});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||"Diçka shkoi keq. Ju lutemi provoni përsëri.");e.status=r.status;throw e}
  return j;
}
const ownerHeader=id=>{const k=ownerKeys()[id];return k?{"X-Owner-Key":k}:{}};
function uploadFile(file,onProgress){
  return new Promise((resolve,reject)=>{
    const x=new XMLHttpRequest();
    x.open("POST","/api/upload?name="+encodeURIComponent(file.name));
    x.setRequestHeader("Content-Type","application/octet-stream");
    x.upload.onprogress=e=>{if(e.lengthComputable&&onProgress)onProgress(e.loaded/e.total)};
    x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}
      if(x.status>=200&&x.status<300)resolve(j);else reject(new Error(j.error||"Ngarkimi dështoi. Provoni përsëri."))};
    x.onerror=()=>reject(new Error("Nuk u lidh me serverin. Kontrolloni internetin dhe provoni përsëri."));
    x.send(file);
  });
}

function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function hue(name){let h=0;for(const c of String(name))h=(h*31+c.charCodeAt(0))%360;return h}
function initials(n){const p=String(n||"?").trim().split(/\s+/);return((p[0]||"?")[0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase()}
function avatar(n){return `<span class="avatar" style="background:hsl(${(hue(n)%80)+220} 55% 45%)" aria-hidden="true">${esc(initials(n))}</span>`}
function ago(t){if(!t)return"";const s=(Date.now()-t)/1000;if(s<60)return"tani";
  if(s<3600)return"para "+Math.floor(s/60)+" min";
  if(s<86400){const h=Math.floor(s/3600);return"para "+h+(h===1?" ore":" orësh")}
  const d=Math.floor(s/86400);if(d<30)return"para "+d+(d===1?" dite":" ditësh");
  return new Date(t).toLocaleDateString("sq-AL")}
function fmtSize(b){if(!b)return"";if(b<1024)return b+" B";if(b<1048576)return Math.round(b/1024)+" KB";return(b/1048576).toFixed(1).replace(".",",")+" MB"}
const plural=(n,one,many)=>n+" "+(n===1?one:many);
function extOf(name){const m=String(name||"").toLowerCase().match(/\.([a-z0-9]+)$/);return m?m[1]:""}
function kindOf(name){const e=extOf(name);
  if(e==="pdf")return["pdf","PDF"];
  if(["doc","docx","odt","rtf"].includes(e))return["word","WORD"];
  if(["ppt","pptx","odp"].includes(e))return["ppt","PPT"];
  if(["xls","xlsx","ods","csv"].includes(e))return["excel","EXCEL"];
  if(["png","jpg","jpeg","gif","webp"].includes(e))return["foto","FOTO"];
  if(e==="txt")return["tekst","TEKST"];
  if(["zip","rar","7z"].includes(e))return["zip","ZIP"];
  return["tjeter",(e||"?").toUpperCase().slice(0,5)]}
function fileUrl(f){return f&&f.asset?"/uploads/"+encodeURIComponent(f.asset):""}
function dlUrl(asset,name){return "/uploads/"+encodeURIComponent(asset)+"?download=1&name="+encodeURIComponent(name||asset)}
function typeBox(name,asset,preview){const [k,l]=kindOf(name);const src=preview||(k==="foto"&&asset?"/uploads/"+encodeURIComponent(asset):"");
  return `<span class="ftype t-${k}" aria-hidden="true">${src?`<img src="${esc(src)}" alt="" loading="lazy">`:esc(l)}</span>`}
function facultyOptions(sel,withAll){return (withAll?`<option value="">Të gjitha fakultetet</option>`:"")+FACULTIES.map(f=>`<option ${f===sel?"selected":""}>${esc(f)}</option>`).join("")}

/* ---------- NAV ---------- */
/* Çdo faqe ka adresën e vet (#/...), që rifreskimi dhe butoni "prapa" të funksionojnë */
const SLUG={home:"",sets:"kartat",materials:"materialet",mine:"te-miat",about:"rreth-nesh",create:"krijo",upload:"ngarko",admin:"admin"};
function hashFor(v){
  if(v.name==="set")return "#/set/"+encodeURIComponent(v.id)+(v.mode&&v.mode!=="karta"?"/"+v.mode:"");
  if(v.name==="material")return "#/material/"+encodeURIComponent(v.id);
  if(v.name==="edit")return "#/ndrysho/"+encodeURIComponent(v.id);
  if(v.name==="auth")return "#/hyr"+(v.tab==="signup"?"/regjistrohu":"");
  return "#/"+(SLUG[v.name]||"");
}
function viewFromHash(){
  const parts=location.hash.replace(/^#\/?/,"").split("/").map(x=>{try{return decodeURIComponent(x)}catch(e){return x}});
  const [a,b,c]=parts;
  if(a==="set"&&b)return{name:"set",id:b,mode:["kuiz","perputh"].includes(c)?c:"karta"};
  if(a==="material"&&b)return{name:"material",id:b};
  if(a==="ndrysho"&&b)return{name:"edit",id:b};
  if(a==="hyr")return{name:"auth",tab:b==="regjistrohu"?"signup":"login"};
  if(a==="krijo-manualisht")return{name:"create"};
  const name=Object.keys(SLUG).find(k=>SLUG[k]===(a||""));
  return{name:name||"home"};
}
let skipHash=null;
function go(name,extra){
  view=Object.assign({name},extra||{});
  $("#mmenu").classList.remove("open");$("#hamb").setAttribute("aria-expanded","false");closeDd();
  const h=hashFor(view);if(location.hash!==h){skipHash=h;location.hash=h}
  render();window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>{
  if(location.hash===skipHash){skipHash=null;return}
  skipHash=null;view=viewFromHash();closeDd();render();window.scrollTo(0,0);
});
function setMode(mode){view.mode=mode;try{history.replaceState(null,"",hashFor(view))}catch(e){}}
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{const g=b.dataset.go;if(g==="home"){query="";$("#q").value=""}go(g)}));
/* Butoni i llogarisë në navbar */
function closeDd(){document.querySelectorAll(".dd-menu").forEach(m=>m.remove())}
document.addEventListener("click",e=>{if(!e.target.closest(".dd"))closeDd()});
function renderAuthSlots(){
  const d=$(".auth-slot"),m=$(".auth-slot-m");
  if(!me){
    d.innerHTML=`<button class="btn btn-ghost" data-auth="login">Hyr</button>`;
    m.innerHTML=`<button class="btn btn-ghost" data-auth="login">Hyr / Regjistrohu</button>`;
  }else{
    d.innerHTML=`<span class="dd"><button class="user-chip" id="uchip" aria-haspopup="true">${avatar(me.name)}<span class="nm">${esc(me.name.split(" ")[0])}</span>${me.isAdmin?'<span class="admin-badge">ADMIN</span>':""}</button></span>`;
    m.innerHTML=`${me.isAdmin?`<button class="btn btn-ghost" data-go-a="admin">Paneli i adminit</button>`:""}<button class="btn btn-ghost" data-logout>Dil (${esc(me.name)})</button>`;
    $("#uchip").onclick=e=>{e.stopPropagation();if(document.querySelector(".dd-menu")){closeDd();return}
      const menu=document.createElement("div");menu.className="dd-menu";
      menu.innerHTML=`<div class="who"><b style="color:var(--ink)">${esc(me.name)}</b><br>${esc(me.email)}</div>${me.isAdmin?`<button data-go-a="admin">Paneli i adminit</button>`:""}<button data-go-a="mine">Të miat</button><button data-logout>Dil</button>`;
      $("#uchip").parentNode.appendChild(menu);bindAuthButtons(menu)};
  }
  bindAuthButtons(d);bindAuthButtons(m);
}
function bindAuthButtons(root){
  root.querySelectorAll("[data-auth]").forEach(b=>b.onclick=()=>go("auth",{tab:b.dataset.auth}));
  root.querySelectorAll("[data-go-a]").forEach(b=>b.onclick=()=>go(b.dataset.goA));
  root.querySelectorAll("[data-logout]").forEach(b=>b.onclick=async()=>{try{await api("POST","/api/auth/logout")}catch(e){}me=null;renderAuthSlots();toast("Dolët nga llogaria");await refresh(true);go("home")});
}

$("#hamb").onclick=()=>{const m=$("#mmenu");const o=m.classList.toggle("open");$("#hamb").setAttribute("aria-expanded",String(o))};

function markNav(){document.querySelectorAll(".menu-link").forEach(b=>{if(b.dataset.go===view.name)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")})}

/* ---------- RENDER ---------- */
function render(){
  markNav();
  if(view.name==="create"||view.name==="edit")return renderForm();
  if(view.name==="set")return renderSet();
  if(view.name==="upload")return renderUpload();
  if(view.name==="material")return renderMaterial();
  if(view.name==="about")return renderAbout();
  if(view.name==="auth")return renderAuth();
  if(view.name==="admin")return renderAdmin();
  renderList();
}
function banner(){return dbState==="offline"?`<div class="notice">Nuk po lidhemi dot me serverin e Sinapsës. Kontrolloni internetin dhe rifreskoni faqen.</div>`:""}
function words(q){return q.toLowerCase().split(/\s+/).filter(Boolean)}
function setMatches(s){
  if(facultyFilter&&s.faculty!==facultyFilter)return false;
  if(!query)return true;
  const hay=[s.title,s.author,s.faculty,s.subject,s.description,...(s.cards||[]).flatMap(c=>[c.term,c.def])].join(" ").toLowerCase();
  return words(query).every(w=>hay.includes(w));
}
function matMatches(m){
  if(facultyFilter&&m.faculty!==facultyFilter)return false;
  if(!query)return true;
  const hay=[m.title,m.uploader,m.faculty,m.subject,m.fileName].join(" ").toLowerCase();
  return words(query).every(w=>hay.includes(w));
}
function setCard(s){
  const n=(s.cards||[]).length,f=(s.files||[]).length;
  return `<button class="set-card" data-open="${esc(s.id)}">
    <div class="meta-row"><span class="pill fac">${I.cap} ${esc(s.faculty||"Tjetër")}</span></div>
    <h3>${esc(s.title||"Set pa titull")}</h3>
    <div class="meta-row">${s.subject?`<span>${esc(s.subject)}</span><span aria-hidden="true">·</span>`:""}<span>${plural(n,"kartë","karta")}</span>${f?`<span aria-hidden="true">·</span><span>${plural(f,"skedar","skedarë")}</span>`:""}</div>
    <div class="author">${avatar(s.author)}<div><div class="by">Krijuar nga · ${esc(ago(s.createdAt))}</div><div class="nm">${esc(s.author||"Anonim")}</div></div></div>
  </button>`;
}
function matCard(m){
  return `<button class="mat-card" data-mat="${esc(m.id)}">${typeBox(m.fileName,m.asset)}
    <div class="body"><h3>${esc(m.title)}</h3>
      <div class="meta-row"><span class="pill fac">${I.cap} ${esc(m.faculty||"Tjetër")}</span>${m.aiStatus==="done"&&m.setId?`<span class="pill ai-pill">${I.game} Kuiz</span>`:""}</div>
      <div class="meta-row"><span>Ngarkuar nga <b style="color:var(--ink)">${esc(m.uploader||"Anonim")}</b></span></div>
      <div class="meta-row"><span>${esc(fmtSize(m.size))}</span><span aria-hidden="true">·</span><span>${esc(ago(m.createdAt))}</span></div>
    </div></button>`;
}
function emptyBox(title,text,btn){return `<div class="empty"><h3>${title}</h3>${text?`<p>${text}</p>`:""}${btn||""}</div>`}
function filterRow(){return `<div class="filters"><label for="ff">Fakulteti:</label><select class="t" id="ff" style="width:auto">${facultyOptions(facultyFilter,true)}</select>${facultyFilter?`<button class="link-btn" id="ff-clear">Hiq filtrin</button>`:""}</div>`}
function bindCommon(){
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>go("set",{id:b.dataset.open}));
  app.querySelectorAll("[data-mat]").forEach(b=>b.onclick=()=>go("material",{id:b.dataset.mat}));
  app.querySelectorAll("[data-go2]").forEach(b=>b.onclick=()=>go(b.dataset.go2));
  const ff=$("#ff");if(ff)ff.onchange=()=>{facultyFilter=ff.value;render()};
  const fc=$("#ff-clear");if(fc)fc.onclick=()=>{facultyFilter="";render()};
  app.querySelectorAll("[data-fac]").forEach(b=>b.onclick=()=>{facultyFilter=b.dataset.fac;go(b.dataset.target||"sets")});
}
function renderList(){
  const loading=dbState==="loading";
  let S=sets.filter(setMatches),M=materials.filter(matMatches);
  if(view.name==="mine"){S=S.filter(isMine);M=M.filter(isMine)}
  let html=banner();
  const setsBlock=(title,list,limit,more)=>`<section class="section"><div class="section-head"><h2>${title}</h2><span class="meta-row">${loading?"":plural(list.length,"set","sete")}${more?` · <button class="link-btn" data-go2="sets">Shiko të gjitha</button>`:""}</span></div>
    ${loading?emptyBox("Duke u ngarkuar…"):list.length?`<div class="grid">${list.slice(0,limit||9999).map(setCard).join("")}</div>`
      :emptyBox(query?`Asnjë set nuk përputhet me “${esc(query)}”`:facultyFilter?`Ende nuk ka sete për ${esc(facultyFilter)}`:"Ende nuk ka sete",query?"Provoni një fjalë më të shkurtër ose kontrolloni drejtshkrimin.":"",query?"":`<button class="btn btn-primary" data-go2="create">Krijo një set</button>`)}</section>`;
  const matsBlock=(title,list,limit,more)=>`<section class="section"><div class="section-head"><h2>${title}</h2><span class="meta-row">${loading?"":plural(list.length,"material","materiale")}${more?` · <button class="link-btn" data-go2="materials">Shiko të gjitha</button>`:""}</span></div>
    ${loading?emptyBox("Duke u ngarkuar…"):list.length?`<div class="grid">${list.slice(0,limit||9999).map(matCard).join("")}</div>`
      :emptyBox(query?`Asnjë material nuk përputhet me “${esc(query)}”`:facultyFilter?`Ende nuk ka materiale për ${esc(facultyFilter)}`:"Ende nuk ka materiale",query?"":"Ndani skriptat, ligjëratat dhe detyrat me kolegët.",query?"":`<button class="btn btn-primary" data-go2="upload">Ngarko material</button>`)}</section>`;

  if(query){
    html+=`<div class="page-head"><div><h1>Rezultatet për “${esc(query)}”</h1></div></div>${filterRow()}`+setsBlock("Setet e kartave",S)+matsBlock("Materialet",M);

function addFiles(list){
  for(const f of list){
    if(!SET_FILE_RE.test(f.type)){toast(`“${f.name}” nuk mund të shtohet këtu. Ngarkojeni te faqja Materialet.`);continue}
    if(f.size>MAX_MB*1048576){toast(`“${f.name}” është më i madh se ${MAX_MB} MB.`);continue}
    draft.files.push({name:f.name,type:f.type,size:f.size,_pending:f,_preview:f.type.startsWith("image/")?URL.createObjectURL(f):""});
  }
  renderFiles();
}
function renderFiles(){
  const box=$("#flist");if(!box)return;
  box.innerHTML=draft.files.map((f,i)=>`<div class="file-item">${typeBox(f.name,f.asset,f._preview)}<div class="file-meta"><b>${esc(f.name)}</b><small>${esc(fmtSize(f.size))}${f._pending?" · gati për ngarkim":""}</small></div><button class="icon-btn del" data-rmf="${i}" aria-label="Hiq ${esc(f.name)}">${I.trash}</button></div>`).join("");

async function saveDraft(){
  const d=draft,err=$("#form-err");err.textContent="";
  const author=d.author.trim(),title=d.title.trim();
  const cards=d.cards.filter(c=>(c.term||"").trim()||(c.def||"").trim()||c.img||c._pending);
  if(!author){err.textContent="Ju lutemi shkruani emrin tuaj në krye, që kolegët ta dinë kush e ka krijuar setin.";$("#f-author").focus();return}
  if(!d.faculty){err.textContent="Ju lutemi zgjidhni fakultetin.";$("#f-faculty").focus();return}
  if(!title){err.textContent="Ju lutemi jepini setit një titull.";$("#f-title").focus();return}
  if(!cards.length){err.textContent="Shtoni të paktën një kartë (para dhe prapa).";return}
  const btn=$("#save"),label=btn.textContent;btn.disabled=true;btn.textContent="Duke ruajtur…";
  try{
    const outFiles=[];
    for(const f of d.files){
      if(f._pending){const r=await uploadFile(f._pending,p=>btn.textContent=`Duke ngarkuar ${Math.round(p*100)}%`);outFiles.push({name:f.name,type:f.type,size:f.size,asset:r.id})}
      else outFiles.push({name:f.name,type:f.type,size:f.size,asset:f.asset});
    }
    const outCards=[];
    for(const c of cards){
      const o={term:(c.term||"").trim(),def:(c.def||"").trim()};
      if(c._pending){btn.textContent="Duke ngarkuar fotot…";const r=await uploadFile(c._pending);o.img={asset:r.id,name:c._pending.name,type:c._pending.type}}
      else if(c.img)o.img=c.img;
      outCards.push(o);
    }
    const body={title,author,faculty:d.faculty,subject:d.subject.trim(),description:d.description.trim(),cards:outCards,files:outFiles};
    lsSet("sin_name",author);lsSet("sin_fac",d.faculty);
    let id=view.id,rec;
    if(id)rec=await api("PUT","/api/sets/"+encodeURIComponent(id),body,ownerHeader(id));else rec=await api("POST","/api/sets",body);
    id=rec.id;saveOwnerKey(id,rec.ownerKey);delete rec.ownerKey;upsert(sets,rec);
    const wasEdit=view.name==="edit";draft=null;toast(wasEdit?"Ndryshimet u ruajtën":"Seti u krijua");go("set",{id});
  }catch(e){btn.disabled=false;btn.textContent=label;err.textContent=(e&&e.message)||"Ruajtja dështoi. Kontrolloni lidhjen dhe provoni përsëri."}
}
function upsert(arr,rec){const i=arr.findIndex(s=>s.id===rec.id);if(i>=0)arr[i]=rec;else arr.unshift(rec)}

        const r=await uploadFile(f.file,p=>{const pct=(doneBytes+p*f.file.size)/total;bar.firstElementChild.style.width=(pct*100).toFixed(0)+"%";btn.textContent=`Duke ngarkuar ${Math.round(pct*100)}%`});
        const rec=await api("POST","/api/materials",{title:f.title.trim(),faculty:up.faculty,subject:up.subject.trim(),uploader:up.uploader.trim(),asset:r.id,fileName:f.file.name,size:f.file.size});
        saveOwnerKey(rec.id,rec.ownerKey);delete rec.ownerKey;upsert(materials,rec);lastId=rec.id;
        f.status="ok";f.msg="U ngarkua";okCount++;
      }catch(e){f.status="bad";f.msg=e.message}
      doneBytes+=f.file.size;showChosen();
    }
    if(up.uploader.trim())lsSet("sin_name",up.uploader.trim());lsSet("sin_fac",up.faculty);
    up.busy=false;btn.disabled=false;bar.hidden=true;
    const failed=up.files.filter(f=>f.status==="bad").length;
    if(!failed){const n=okCount;up=null;toast(n===1?"Materiali u ngarkua":`U ngarkuan ${n} materiale`);n===1&&lastId?go("material",{id:lastId}):go("materials");return}
    showChosen();updBtn();
    err.textContent=`${okCount?`U ngarkuan ${okCount}. `:""}${failed===1?"Një skedar nuk u ngarkua":`${failed} skedarë nuk u ngarkuan`} – shikoni arsyen më lart dhe provoni përsëri.`;
  };
}

/* ---------- LOJËRAT ---------- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const todayKey=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function dayStreak(){const st=lsGet("sin_streak",{last:"",n:0});const y=new Date(Date.now()-86400000);const yk=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  return st.last===todayKey()||st.last===yk?st.n:0}
function markPlayed(){const st=lsGet("sin_streak",{last:"",n:0});if(st.last===todayKey())return st.n;
  const n=dayStreak()+1;lsSet("sin_streak",{last:todayKey(),n});return n}
/* tinguj të vegjël për lojën (mund të fiken) */
let actx=null;
function beep(ok){if(lsGet("sin_mute",false))return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const notes=ok?[660,880]:[220,165];notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=ok?"triangle":"sawtooth";o.frequency.value=f;
    const t=actx.currentTime+i*.09;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(ok?.18:.08,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.18)})}catch(e){}}
function popXp(el,txt){try{const r=el.getBoundingClientRect();const p=document.createElement("div");p.className="pop";p.textContent=txt;p.style.left=(r.right-70)+"px";p.style.top=(r.top-10)+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),950)}catch(e){}}

/* Pyetjet: nga AI, ose të krijuara nga kartat (duhen të paktën 4 karta) */
function buildQuestions(s){
  if(s.quiz&&s.quiz.length)return shuffle(s.quiz).map(q=>{const order=shuffle([0,1,2,3]);return{q:q.q,hint:"Zgjidhni përgjigjen e saktë",options:order.map(i=>q.options[i]),answer:order.indexOf(q.answer),explanation:q.explanation||""}});
  const c=(s.cards||[]).filter(x=>x.term&&x.def);if(c.length<4)return[];
  return shuffle(c).slice(0,20).map(card=>{const others=shuffle(c.filter(x=>x.term!==card.term)).slice(0,3).map(x=>x.term);if(others.length<3)return null;
    const options=shuffle([card.term,...others]);return{q:card.def,hint:"Cili term përputhet me këtë përshkrim?",options,answer:options.indexOf(card.term),explanation:`${card.term}: ${card.def}`}}).filter(Boolean);
}
let G=null;
function newGame(s,onlyWrong){
  let qs=buildQuestions(s);
  if(onlyWrong&&G&&G.id===s.id&&G.missed.length){const miss=new Set(G.missed);qs=qs.filter(q=>miss.has(q.q));}
  G={id:s.id,qs,queue:qs.map((_,i)=>i),pos:0,hearts:3,xp:0,streak:0,best:0,firstRight:0,cleared:0,requeued:new Set(),missed:[],picked:null,state:"ask"};
}
function renderQuiz(s,restart){
  const box=$("#study");if(!box)return;
  if(restart||!G||G.id!==s.id)newGame(s);
  if(!G.qs.length){box.innerHTML=`<div class="game">${emptyBox("Ky set ka shumë pak karta për kuiz","Kuizi krijohet kur seti ka të paktën 4 karta.")}</div>`;return}
  if(G.state==="over"||G.state==="done")return quizResult(s);
  const q=G.qs[G.queue[G.pos]],total=G.qs.length,answered=G.state!=="ask";
  const hearts=[0,1,2].map(i=>`<span style="color:${i<G.hearts?"#E5484D":"var(--line)"};fill:currentColor">${I.heart}</span>`).join("");
  box.innerHTML=`<div class="game">
    <div class="game-top"><div class="hearts" aria-label="${G.hearts} jetë">${hearts}</div>
      <div class="gbar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${G.cleared}" aria-label="Përparimi"><i style="width:${(G.cleared/total*100).toFixed(1)}%"></i></div>
      ${G.streak>1?`<span class="streak" title="Përgjigje të sakta rresht">${I.flame}${G.streak}</span>`:""}<span class="xp" id="xp">${G.xp} XP</span>
      <button class="mute" id="mute" aria-label="${lsGet("sin_mute",false)?"Ndize zërin":"Fike zërin"}">${lsGet("sin_mute",false)?I.mute:I.sound}</button></div>
    <div class="qcard" id="qcard"><div class="qhint">${esc(q.hint)}</div><div class="qtext">${esc(q.q)}</div>
      <div class="opts">${q.options.map((o,i)=>{let cls="";if(answered){if(i===q.answer)cls="right";else if(i===G.picked)cls="wrong";else cls="dim"}
        return `<button class="qopt ${cls}" data-opt="${i}" ${answered?"disabled":""}><span class="k">${i+1}</span><span class="t">${esc(o)}</span></button>`}).join("")}</div>
      ${answered?`<div class="fbk ${G.state==="right"?"ok":"no"}"><div class="msg"><b>${G.state==="right"?pickPraise():"Jo tamam."}</b><span>${esc(G.state==="right"?(q.explanation||""):("Përgjigjja e saktë: "+q.options[q.answer]+(q.explanation?" – "+q.explanation:"")))}</span></div>
        <button class="btn btn-primary" id="qnext">${G.hearts===0?"Shiko rezultatin":"Vazhdo"}</button></div>`:""}
    </div>
    <div class="kbd">Tastiera: 1–4 për të zgjedhur · Enter për të vazhduar</div></div>`;
  $("#mute").onclick=()=>{lsSet("sin_mute",!lsGet("sin_mute",false));renderQuiz(s)};
  box.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
    if(G.state!=="ask")return;G.picked=+b.dataset.opt;const idx=G.queue[G.pos];
    if(G.picked===q.answer){G.state="right";G.streak++;G.best=Math.max(G.best,G.streak);const gain=10+Math.min(G.streak-1,5)*2;G.xp+=gain;G.cleared++;
      if(!G.requeued.has(idx))G.firstRight++;beep(true);renderQuiz(s);popXp($("#xp"),"+"+gain)}
    else{G.state="wrong";G.streak=0;G.hearts--;if(!G.missed.includes(q.q))G.missed.push(q.q);
      if(!G.requeued.has(idx)&&G.hearts>0){G.requeued.add(idx);G.queue.push(idx)}else if(G.requeued.has(idx)){}
      beep(false);renderQuiz(s);const c=$("#qcard");if(c){c.classList.add("shake");}}
  });
  const nx=$("#qnext");if(nx){nx.focus({preventScroll:true});const fb=$(".fbk");if(fb)fb.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});nx.onclick=()=>{
    if(G.hearts<=0){G.state="over";markPlayed();return renderQuiz(s)}
    G.pos++;G.picked=null;
    if(G.pos>=G.queue.length){G.state="done";markPlayed();return renderQuiz(s)}
    G.state="ask";renderQuiz(s)}}
}
const PRAISE=["Saktë!","Shkëlqyeshëm!","Bravo!","Ashtu është!","Super!"];
function pickPraise(){return PRAISE[Math.floor(Math.random()*PRAISE.length)]}
function quizResult(s){
  const box=$("#study"),total=G.qs.length,acc=Math.round(G.firstRight/total*100),won=G.state==="done";
  const stars=won?(acc>=90?3:acc>=70?2:1):0;
  const bests=lsGet("sin_best",{}),prev=bests[s.id]||0,rec=G.xp>prev;if(rec){bests[s.id]=G.xp;lsSet("sin_best",bests)}
  const ds=dayStreak();
  box.innerHTML=`<div class="game"><div class="result">
    <h2>${won?(stars===3?"E përsosur!":"Raundi përfundoi!"):"Mbaruan jetët!"}</h2>
    <p style="color:var(--muted);margin:6px 0 0">${won?"I kaluat të gjitha pyetjet.":"Mos u dorëzo – provo sërish, pyetjet e gabuara kthehen."}</p>
    <div class="stars" aria-label="${stars} yje nga 3">${[0,1,2].map(i=>`<span style="fill:${i<stars?"#F5B301":"var(--line)"}">${I.star}</span>`).join("")}</div>
    ${ds?`<span class="day-streak">${I.flame} ${plural(ds,"ditë","ditë")} rresht duke mësuar</span>`:""}
    <div class="rstats"><div><b>${G.xp}</b><small>XP${rec&&G.xp?" · rekord i ri!":""}</small></div><div><b>${acc}%</b><small>saktë herën e parë</small></div><div><b>${G.best}</b><small>seria më e gjatë</small></div></div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">${G.missed.length?`<button class="btn btn-primary" id="q-miss">Praktiko ${plural(G.missed.length,"gabimin","gabimet")}</button>`:""}<button class="btn ${G.missed.length?"btn-ghost":"btn-primary"}" id="q-again">Luaj sërish</button><button class="btn btn-ghost" id="q-match">${I.bolt} Provo Përputh</button></div>
  </div></div>`;
  $("#q-again").onclick=()=>renderQuiz(s,true);
  if($("#q-miss"))$("#q-miss").onclick=()=>{newGame(s,true);renderQuiz(s)};
  $("#q-match").onclick=()=>{setMode("perputh");app.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-selected",String(x.dataset.mode==="perputh")));renderMatch(s,true)};
}

let M=null,matchTimer=null;
function stopMatchTimer(){if(matchTimer){clearInterval(matchTimer);matchTimer=null}}
function newMatch(s){
  const c=shuffle((s.cards||[]).filter(x=>x.term&&x.def)).slice(0,6);
  const cut=t=>t.length>110?t.slice(0,107)+"…":t;
  const tiles=shuffle(c.flatMap((card,i)=>[{pair:i,kind:"term",text:cut(card.term)},{pair:i,kind:"def",text:cut(card.def)}])).map((t,k)=>Object.assign(t,{k}));
  M={id:s.id,tiles,sel:null,gone:new Set(),start:0,penalty:0,end:0,pairs:c.length};
}
function fmtTime(ms){return (ms/1000).toFixed(1).replace(".",",")+" s"}
function renderMatch(s,restart){
  const box=$("#study");if(!box)return;stopMatchTimer();
  if(restart||!M||M.id!==s.id)newMatch(s);
  if(M.pairs<2){box.innerHTML=`<div class="game">${emptyBox("Ky set ka shumë pak karta për këtë lojë")}</div>`;return}
  if(M.end){const t=M.end-M.start+M.penalty,bests=lsGet("sin_match",{}),prev=bests[s.id],rec=!prev||t<prev;if(rec){bests[s.id]=t;lsSet("sin_match",bests)}
    box.innerHTML=`<div class="game"><div class="result"><h2>${rec?"Rekord i ri!":"Bravo!"}</h2><p style="color:var(--muted);margin:6px 0 0">I përputhët të ${M.pairs} çiftet.</p>
      <div class="rstats"><div><b>${fmtTime(t)}</b><small>koha juaj</small></div><div><b>${fmtTime(Math.min(t,prev||t))}</b><small>rekordi juaj</small></div></div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn btn-primary" id="m-again">Luaj sërish</button><button class="btn btn-ghost" id="m-quiz">${I.game} Provo Kuizin</button></div></div></div>`;
    $("#m-again").onclick=()=>renderMatch(s,true);
    $("#m-quiz").onclick=()=>{setMode("kuiz");app.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-selected",String(x.dataset.mode==="kuiz")));renderQuiz(s,true)};
    return}
  box.innerHTML=`<div class="game" style="max-width:900px"><div class="match-top"><div><b>Përputhni termat me përkufizimet</b><div style="color:var(--muted);font-size:14px">Çdo gabim shton 1 sekondë.</div></div><span class="clock" id="clock" aria-live="off">0,0 s</span></div>
    <div class="match-grid">${M.tiles.map(t=>`<button class="mt ${t.kind}${M.gone.has(t.k)?" gone":""}" data-k="${t.k}">${esc(t.text)}</button>`).join("")}</div></div>`;
  const clock=$("#clock");
  const tick=()=>{if(!M.start){clock.textContent="0,0 s";return}clock.textContent=fmtTime(Date.now()-M.start+M.penalty)};
  if(M.start){matchTimer=setInterval(()=>{if(view.name!=="set"||view.mode!=="perputh"){stopMatchTimer();return}tick()},100);tick()}
  box.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
    const t=M.tiles[+b.dataset.k];if(M.gone.has(t.k))return;
    if(!M.start){M.start=Date.now();matchTimer=setInterval(()=>{if(view.name!=="set"||view.mode!=="perputh"){stopMatchTimer();return}tick()},100)}
    if(M.sel===null){M.sel=t.k;b.classList.add("sel");return}
    if(M.sel===t.k){M.sel=null;b.classList.remove("sel");return}
    const a=M.tiles[M.sel],ea=box.querySelector(`[data-k="${a.k}"]`);M.sel=null;
    if(a.pair===t.pair&&a.kind!==t.kind){beep(true);[ea,b].forEach(x=>{x.classList.remove("sel");x.classList.add("ok")});M.gone.add(a.k);M.gone.add(t.k);
      setTimeout(()=>{[ea,b].forEach(x=>x.classList.add("gone"));if(M.gone.size===M.tiles.length){M.end=Date.now();stopMatchTimer();markPlayed();setTimeout(()=>renderMatch(s),350)}},250)}
    else{beep(false);M.penalty+=1000;[ea,b].forEach(x=>{x.classList.remove("sel");x.classList.add("bad")});setTimeout(()=>[ea,b].forEach(x=>x.classList.remove("bad")),450)}
  });
}

    <section class="panel"><h2>Raportimet që presin${d.reports.length?`<span class="count-badge">${d.reports.length}</span>`:""}</h2><p class="hint">Përmbajtje që studentët kanë raportuar. Shikojeni dhe vendosni.</p>
      ${d.reports.length?`<div class="task-list">${d.reports.map(r=>`<div class="task"><div class="body"><b>${esc(r.itemTitle||"(përmbajtja nuk ekziston më)")}</b><small>${r.type==="set"?"Set kartash":"Material"} · ${esc(ago(r.createdAt))}${r.reason?` · “${esc(r.reason)}”`:""}</small></div>
        <div class="acts">${r.itemTitle?`<button class="btn btn-ghost btn-sm" data-open-r="${esc(r.type)}:${esc(r.itemId)}">Shiko</button><button class="btn btn-danger btn-sm" data-del-r="${esc(r.type)}:${esc(r.itemId)}">Fshi përmbajtjen</button>`:""}<button class="btn btn-ghost btn-sm" data-dismiss="${esc(r.id)}">Hiq raportin</button></div></div>`).join("")}</div>`
        :`<p style="margin:0;color:var(--good);font-weight:700">Asnjë raportim. Gjithçka në rregull ✓</p>`}
    </section>
    <section class="panel"><h2>Përmbajtja më e re</h2><p class="hint">Setet dhe materialet e fundit. Si admin mund të fshini çdo gjë.</p>
      <div class="task-list">${[...sets.map(s=>({t:"set",x:s})),...materials.map(m=>({t:"material",x:m}))].sort((a,b)=>(b.x.createdAt||0)-(a.x.createdAt||0)).slice(0,8).map(({t,x})=>`<div class="task"><div class="body"><b>${esc(x.title)}</b><small>${t==="set"?"Set":"Material"} · ${esc(x.faculty)} · ${esc(t==="set"?x.author:(x.uploader||"Anonim"))} · ${esc(ago(x.createdAt))}</small></div>
        <div class="acts"><button class="btn btn-ghost btn-sm" data-open-r="${t}:${esc(x.id)}">Shiko</button><button class="btn btn-danger btn-sm" data-del-r="${t}:${esc(x.id)}">Fshi</button></div></div>`).join("")||`<p style="margin:0;color:var(--muted)">Ende nuk ka përmbajtje.</p>`}</div>
    </section>
  </div>
  <section class="panel"><h2>Llogaritë (${d.users.length})</h2><p class="hint">Mund t'i bëni të tjerët admin ose t'ua fshini llogarinë. Setet e tyre mbeten në faqe.</p>
    ${d.users.length?`<div class="table-wrap"><table class="users"><thead><tr><th>Emri</th><th>Email</th><th>Sete</th><th>Materiale</th><th>Regjistruar</th><th>Hyrja e fundit</th><th></th></tr></thead><tbody>
      ${d.users.map(u=>`<tr><td><b>${esc(u.name)}</b> ${u.isAdmin?'<span class="admin-badge">ADMIN</span>':""}</td><td>${esc(u.email)}</td><td class="num">${u.sets}</td><td class="num">${u.materials}</td><td>${esc(ago(u.createdAt))}</td><td>${esc(ago(u.lastLogin))}</td>
        <td>${u.id===me.id?'<span class="opt">Ju</span>':`<div class="acts" style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" data-role="${esc(u.id)}" data-make="${u.isAdmin?0:1}">${u.isAdmin?"Hiq adminin":"Bëje admin"}</button><button class="btn btn-danger btn-sm" data-deluser="${esc(u.id)}" data-name="${esc(u.name)}">Fshi</button></div>`}</td></tr>`).join("")}
    </tbody></table></div>`:`<p style="margin:0;color:var(--muted)">Ende nuk është regjistruar askush.</p>`}
  </section>
  <div id="confirm-slot"></div>`;
  $("#a-refresh").onclick=()=>{adminData=null;renderAdmin()};
  app.querySelectorAll("[data-ai-all],[data-ai-one]").forEach(b=>b.onclick=async()=>{b.disabled=true;
    try{const r=await api("POST","/api/admin/ai",b.dataset.aiOne?{id:b.dataset.aiOne}:{all:b.dataset.aiAll});toast(r.queued?`${plural(r.queued,"material","materiale")} në radhë – kartat krijohen një nga një`:"Asgjë për të krijuar");adminData=null;renderAdmin()}
    catch(e){b.disabled=false;toast(e.message)}});
  app.querySelectorAll("[data-open-r]").forEach(b=>b.onclick=()=>{const [t,id]=b.dataset.openR.split(":");go(t==="set"?"set":"material",{id})});
  app.querySelectorAll("[data-del-r]").forEach(b=>b.onclick=async()=>{const [t,id]=b.dataset.delR.split(":");
    if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Kliko sërish për ta fshirë";return}
    try{await api("DELETE",(t==="set"?"/api/sets/":"/api/materials/")+encodeURIComponent(id));toast("U fshi");await refresh(true);adminData=null;renderAdmin()}catch(e){toast(e.message)}});
  app.querySelectorAll("[data-dismiss]").forEach(b=>b.onclick=async()=>{try{await api("DELETE","/api/admin/reports/"+encodeURIComponent(b.dataset.dismiss));adminData=null;renderAdmin()}catch(e){toast(e.message)}});
  app.querySelectorAll("[data-role]").forEach(b=>b.onclick=async()=>{try{await api("POST","/api/admin/users/"+encodeURIComponent(b.dataset.role),{isAdmin:b.dataset.make==="1"});toast("U ruajt");adminData=null;renderAdmin()}catch(e){toast(e.message)}});
  app.querySelectorAll("[data-deluser]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Kliko sërish";return}
    try{await api("DELETE","/api/admin/users/"+encodeURIComponent(b.dataset.deluser));toast(`Llogaria e ${b.dataset.name} u fshi`);adminData=null;renderAdmin()}catch(e){toast(e.message)}});
}
async function loadAdmin(){
  try{adminData=await api("GET","/api/admin/overview");if(view.name==="admin")renderAdmin()}
  catch(e){if(view.name==="admin")app.innerHTML=emptyBox("Paneli nuk u hap",esc(e.message))}
}

/* ---------- BOOT ---------- */
let lastStamp="";
async function refresh(force){
  try{
    const r=await api("GET","/api/all");
    const meChanged=JSON.stringify(r.me)!==JSON.stringify(me);me=r.me;if(meChanged)renderAuthSlots();
    if(force)lastStamp="";
    const stamp=JSON.stringify([r.sets.map(s=>[s.id,s.updatedAt||s.createdAt]),r.materials.map(m=>m.id)]);
    const wasReady=dbState==="ready";
    sets=r.sets;materials=r.materials;dbState="ready";const aiWas=aiOn;aiOn=!!r.ai;
    const v=view.name;
    linkGeneratedKeys();
    if(!wasReady&&v!=="upload")render();
    else if(["create","edit","upload","auth","about","admin"].includes(v)){/* mos e ndërpre formularin, lojën ose panelin */}
    else if(v==="set"||v==="material"){const gone=v==="set"?!sets.some(x=>x.id===view.id):!materials.some(x=>x.id===view.id);
      const mt=v==="material"&&materials.find(x=>x.id===view.id),st=mt?mt.aiStatus+(mt.setId||""):"";
      if(!wasReady||gone||(v==="material"&&st!==shownAiStatus))render()}
    else if(stamp!==lastStamp||!wasReady)render();
    lastStamp=stamp;
  }catch(e){if(dbState!=="ready"){dbState="offline";render()}}
}
view=viewFromHash();
renderAuthSlots();render();refresh().then(()=>{if(view.name==="admin")render()});
try{if(!sessionStorage.getItem("sin_counted")){sessionStorage.setItem("sin_counted","1");api("POST","/api/visit",{vid:visitorId()}).catch(()=>{})}}catch(e){api("POST","/api/visit",{vid:visitorId()}).catch(()=>{})}
setInterval(()=>{if(!document.hidden)refresh()},15000);
})();
</script>
